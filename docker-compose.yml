version: '3.8'

services:
  # -------------------------------------------------------------
  # 1. Primary PostgreSQL 15 Database (Transactional Core)
  # -------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: atm_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: atm_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d atm_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - atm_network

  # -------------------------------------------------------------
  # 2. Secondary MongoDB 6.0 Database (Audit Logs)
  # -------------------------------------------------------------
  mongodb:
    image: mongo:6.0
    container_name: atm_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - atm_network

  # -------------------------------------------------------------
  # 3. Redis 7 Cache & Rate Limiting Engine
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: atm_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - atm_network

  # -------------------------------------------------------------
  # 4. Backend Express API Gateway
  # -------------------------------------------------------------
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: atm_api
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/atm_db
      MONGODB_URI: mongodb://mongodb:27017/atm_audit
      REDIS_URL: redis://redis:6379
      JWT_SECRET: supersecret_jwt_key_bellcorp_studio_batch08
      RATE_LIMIT_MAX_REQUESTS: 10
      RATE_LIMIT_WINDOW_SECONDS: 60
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - atm_network

  # -------------------------------------------------------------
  # 5. Frontend React + Vite + Nginx Web Application
  # -------------------------------------------------------------
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: atm_client
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - api
    networks:
      - atm_network

volumes:
  postgres_data:
  mongo_data:
  redis_data:

networks:
  atm_network:
    driver: bridge
